            -o "$RUNNER_TEMP/verify-chemistry-labs"
          "$RUNNER_TEMP/verify-chemistry-labs"

      - name: Verify neuron training model / Проверка модели обучения нейрона
        run: |
          swiftc macOS/ColiDev/App/NeuronTraining.swift macOS/ColiDev/scripts/verify_neuron_training.swift \
            -o "$RUNNER_TEMP/verify-neuron-training"
          "$RUNNER_TEMP/verify-neuron-training"

      - name: Verify entropy and Hardy-Weinberg lab models / Проверка моделей энтропии и Харди — Вайнберга
        run: |
          swiftc macOS/ColiDev/App/StatisticalLabs.swift macOS/ColiDev/scripts/verify_statistical_labs.swift \
            -o "$RUNNER_TEMP/verify-statistical-labs"
          "$RUNNER_TEMP/verify-statistical-labs"

      - name: Verify least-squares lab model / Проверка модели подгонки прямой
        run: |
          swiftc macOS/ColiDev/App/LeastSquaresFit.swift macOS/ColiDev/scripts/verify_least_squares_fit.swift \
            -o "$RUNNER_TEMP/verify-least-squares-fit"
          "$RUNNER_TEMP/verify-least-squares-fit"

      - name: Verify synaptic plasticity and enzyme lab models / Проверка моделей пластичности синапса и кинетики фермента
        run: |
          swiftc macOS/ColiDev/App/LifeMechanismLabs.swift macOS/ColiDev/scripts/verify_life_mechanism_labs.swift \
            -o "$RUNNER_TEMP/verify-life-mechanism-labs"
          "$RUNNER_TEMP/verify-life-mechanism-labs"

      - name: Verify Euler method and autocatalysis lab models / Проверка моделей метода Эйлера и автокатализа
        run: |
          swiftc macOS/ColiDev/App/GrowthModelLabs.swift macOS/ColiDev/scripts/verify_growth_model_labs.swift \
            -o "$RUNNER_TEMP/verify-growth-model-labs"
          "$RUNNER_TEMP/verify-growth-model-labs"

      - name: Verify neural layer and 2D gradient descent lab models / Проверка моделей слоя нейросети и градиентного спуска
        run: |
          swiftc macOS/ColiDev/App/NeuralMathLabs.swift macOS/ColiDev/scripts/verify_neural_math_labs.swift \
            -o "$RUNNER_TEMP/verify-neural-math-labs"
          "$RUNNER_TEMP/verify-neural-math-labs"

      - name: Verify genome fidelity and Hamming distance lab models / Проверка моделей точности копирования и расстояния Хэмминга
        run: |
          swiftc macOS/ColiDev/App/SequenceLabs.swift macOS/ColiDev/scripts/verify_sequence_labs.swift \
            -o "$RUNNER_TEMP/verify-sequence-labs"
          "$RUNNER_TEMP/verify-sequence-labs"

      - name: Verify radioactive dating and feedback loop lab models / Проверка моделей датирования и обратной связи
        run: |
          swiftc macOS/ColiDev/App/RegulationLabs.swift macOS/ColiDev/scripts/verify_regulation_labs.swift \
            -o "$RUNNER_TEMP/verify-regulation-labs"
          "$RUNNER_TEMP/verify-regulation-labs"

      - name: Verify pendulum model / Проверка модели маятника
        run: |
          swiftc macOS/ColiDev/App/Pendulum.swift macOS/ColiDev/scripts/verify_pendulum.swift \
            -o "$RUNNER_TEMP/verify-pendulum"
          "$RUNNER_TEMP/verify-pendulum"

      - name: Verify heat mixing model / Проверка модели смешивания воды
        run: |
          swiftc macOS/ColiDev/App/HeatMixing.swift macOS/ColiDev/scripts/verify_heat_mixing.swift \
            -o "$RUNNER_TEMP/verify-heat-mixing"
          "$RUNNER_TEMP/verify-heat-mixing"

      - name: Verify short message practice / Проверка тренажёра короткого письма
        run: |
          swiftc macOS/ColiDev/App/ShortMessagePractice.swift macOS/ColiDev/scripts/verify_short_message.swift \
            -o "$RUNNER_TEMP/verify-short-message"
          "$RUNNER_TEMP/verify-short-message"

      - name: Verify linear system practice model
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/LinearSystemPractice.swift macOS/ColiDev/scripts/verify_linear_system_practice.swift \
            -o "$RUNNER_TEMP/verify-linear-system-practice"
          "$RUNNER_TEMP/verify-linear-system-practice"

      - name: Verify safe official citation links
        run: |
          swiftc macOS/ColiDev/App/SafeWebReferenceURL.swift macOS/ColiDev/scripts/verify_safe_web_reference_url.swift \
            -o "$RUNNER_TEMP/verify-safe-web-reference-url"
          "$RUNNER_TEMP/verify-safe-web-reference-url"

      - name: Verify bilingual YouTube caption preferences / Проверка языка субтитров YouTube
        run: |
          swiftc macOS/ColiDev/App/YouTubeEmbedURL.swift macOS/ColiDev/scripts/verify_youtube_embed_url.swift \
            -o "$RUNNER_TEMP/verify-youtube-embed-url"
          "$RUNNER_TEMP/verify-youtube-embed-url"

      - name: Verify warnings for broken published builds / Проверка пометок версий, которые не запускаются
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/KnownReleaseIssues.swift macOS/ColiDev/App/L10n.swift macOS/ColiDev/scripts/verify_known_release_issues.swift \
            -o "$RUNNER_TEMP/verify-known-release-issues"
          "$RUNNER_TEMP/verify-known-release-issues"

      - name: Verify tutor source date provenance / Проверить даты источников в цитатах
        run: python macOS/ColiDev/scripts/verify_tutor_source_date_provenance.py

      - name: Verify NotebookLM export provenance / Проверить источники в экспорте NotebookLM
        run: |
          swiftc macOS/ColiDev/App/NotebookLessonExport.swift macOS/ColiDev/scripts/verify_notebook_lesson_export.swift \
            -o "$RUNNER_TEMP/verify-notebook-lesson-export"
          "$RUNNER_TEMP/verify-notebook-lesson-export"

      - name: Set a monotonic app build number / Установить возрастающий номер сборки
        run: echo "COLIDEV_BUILD_VERSION=$(date -u +%Y%m%d)${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build ColiDev for macOS
        run: >-
          xcodebuild
          -project macOS/ColiDev/ColiDev.xcodeproj
          -scheme ColiDev
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ColiDevDerivedData"
          ARCHS=${{ matrix.arch }}
          CURRENT_PROJECT_VERSION=${{ env.COLIDEV_BUILD_VERSION }}
          SUFeedURL=https://raw.githubusercontent.com/weekendbuildings/coli-dev/main/updates/${{ matrix.feed }}
          SUPublicEDKey=${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify updater metadata in the built app
        run: >-
          python macOS/ColiDev/scripts/verify_updater_bundle.py
          "$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          "${{ matrix.arch }}"
          "$COLIDEV_BUILD_VERSION"

      - name: Build Control Center UI tests for macOS
        run: >-
          xcodebuild build-for-testing
          -project macOS/ColiDev/ColiDev.xcodeproj
          -scheme ColiDev
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ColiDevDerivedData"
          ARCHS=${{ matrix.arch }}
          CURRENT_PROJECT_VERSION=${{ env.COLIDEV_BUILD_VERSION }}
          SUFeedURL=https://raw.githubusercontent.com/weekendbuildings/coli-dev/main/updates/${{ matrix.feed }}
          SUPublicEDKey=${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          CODE_SIGN_IDENTITY=-

      - name: Embed the local backend runtime in the app
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          ./macOS/ColiDev/scripts/package_backend_runtime.sh "$app"

      - name: Verify app and backend binary architectures
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          expected_arch="${{ matrix.arch }}"
          for binary in "$app/Contents/MacOS/ColiDev" "$app/Contents/Resources/ColiDevBackend/ColiDevBackend"; do
            architectures="$(lipo -archs "$binary")"
            if [[ "$architectures" != "$expected_arch" ]]; then
              echo "Expected a $expected_arch binary, got '$architectures' for $binary" >&2
              exit 1
            fi
            echo "$binary: $architectures"
          done

      - name: Sign packaged app for UI tests
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          codesign --force --deep --sign - "$app"

      - name: Smoke test the bundled local backend
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          ./macOS/ColiDev/scripts/smoke_test_backend_runtime.sh "$app"

      - name: Verify Control Center opens and renders its overview
        run: >-
          xcodebuild test-without-building
          -project macOS/ColiDev/ColiDev.xcodeproj
          -scheme ColiDev
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/ColiDevDerivedData"
          ARCHS=${{ matrix.arch }}
          CODE_SIGN_IDENTITY=-

      - name: Show local backend startup log / Показать журнал запуска backend
        if: failure()
        run: |
          log="$HOME/Library/Logs/coli-dev/backend-launch.log"
          if [[ -f "$log" ]]; then
            tail -n 120 "$log"
          else
            echo "No bundled backend launch log was created."
          fi

      - name: Export Control Center UI screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ColiDevUITestAttachments"
          result="$(find "$RUNNER_TEMP/ColiDevDerivedData/Logs/Test" -maxdepth 1 -name '*.xcresult' -print -quit)"
          if [ -n "$result" ]; then
            xcrun xcresulttool export attachments \
              --path "$result" \
              --output-path "$RUNNER_TEMP/ColiDevUITestAttachments" \
              || true
          fi

      - name: Upload Control Center UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ColiDev-UI-Test-Screenshots-${{ matrix.runner }}
          path: ${{ runner.temp }}/ColiDevUITestAttachments
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify bundled curriculum roadmaps
        run: |
          resources="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app/Contents/Resources/02_Areas"
          test -x "$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app/Contents/Resources/ColiDevBackend/ColiDevBackend"
          python 01_Projects/curriculum_routes.py "$resources"

      # xcodebuild test injects DYLD_FRAMEWORK_PATH, so UI tests can pass even when the app
      # cannot find its embedded frameworks. Launch it the way Finder does to catch that.
      - name: Verify the app launches outside Xcode / Проверить запуск приложения вне Xcode
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          binary="$app/Contents/MacOS/ColiDev"
          test -f "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          rpaths="$(otool -l "$binary" | grep -A2 LC_RPATH || true)"
          case "$rpaths" in
            *"@executable_path/../Frameworks"*) echo "Runpath found: @executable_path/../Frameworks" ;;
            *) echo "The app binary has no @executable_path/../Frameworks runpath." >&2; exit 1 ;;
          esac
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$binary" >"$RUNNER_TEMP/standalone-launch.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$RUNNER_TEMP/standalone-launch.log"
            echo "ColiDev exited during a standalone launch (status $status)." >&2
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          pkill -f ColiDevBackend || true
          echo "ColiDev stayed running for 10 seconds without Xcode's framework path."

      - name: Package macOS app archive
        id: package
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          app="$RUNNER_TEMP/ColiDevDerivedData/Build/Products/Debug/ColiDev.app"
          arch="$(uname -m)"
          archive="$RUNNER_TEMP/ColiDev-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app archive
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ColiDev-${{ matrix.runner }}-${{ steps.package.outputs.arch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
