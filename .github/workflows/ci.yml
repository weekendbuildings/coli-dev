name: ColiDev CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colidev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run backend test suite
        env:
          OBSIDIAN_API_KEY: ""
          OLLAMA_URL: http://127.0.0.1:11434
          SESSION_MAX_PER_DAY: "5"
        run: python -m pytest 01_Projects -q

      - name: Verify Control Center accessibility mapping / Проверка доступности Центра управления
        run: python macOS/ColiDev/scripts/verify_management_view.py

  macos-build:
    name: macOS app build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            feed: appcast-arm64.xml
          - runner: macos-26
            arch: arm64
            feed: appcast-arm64.xml
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify runner architecture / Проверить архитектуру runner
        run: |
          architecture="$(uname -m)"
          expected_arch="${{ matrix.arch }}"
          if [[ "$architecture" != "$expected_arch" ]]; then
            echo "Expected $expected_arch runner for this app artifact; found '$architecture'." >&2
            exit 1
          fi
          echo "Verified runner architecture: $architecture"

      - name: Verify the versioned local backend handshake / Проверка версии локального backend
        run: |
          swiftc macOS/ColiDev/App/BackendCompatibility.swift macOS/ColiDev/scripts/verify_backend_compatibility.swift \
            -o "$RUNNER_TEMP/verify-backend-compatibility"
          "$RUNNER_TEMP/verify-backend-compatibility"

      - name: Verify subject color and appearance tokens
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/AppVisualSystem.swift macOS/ColiDev/scripts/verify_app_visual_system.swift \
            -o "$RUNNER_TEMP/verify-app-visual-system"
          "$RUNNER_TEMP/verify-app-visual-system"

      - name: Set up Python for the Keychain backend
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and verify the macOS Keychain provider
        run: |
          python -m pip install -r requirements-macos-runtime.txt
          python -c 'from keyring.backends.macOS import Keyring; assert Keyring'

      - name: Verify force prediction identity / Проверка идентификатора прогноза силы
        run: |
          swiftc -parse-as-library macOS/ColiDev/scripts/verify_force_prediction_identity.swift \
            -o "$RUNNER_TEMP/verify-force-prediction-identity"
          "$RUNNER_TEMP/verify-force-prediction-identity"

      - name: Verify learning evidence question identity / Проверка идентификаторов учебных ответов
        run: |
          swiftc -parse-as-library macOS/ColiDev/scripts/verify_learning_evidence_identity.swift \
            -o "$RUNNER_TEMP/verify-learning-evidence-identity"
          "$RUNNER_TEMP/verify-learning-evidence-identity"

      - name: Verify explicit study-format preferences / Проверка предпочтений формата обучения
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/StudyFormatPreference.swift macOS/ColiDev/scripts/verify_study_format_preferences.swift \
            -o "$RUNNER_TEMP/verify-study-format-preferences"
          "$RUNNER_TEMP/verify-study-format-preferences"

      - name: Verify thermoregulation question identity / Проверка идентификатора вопроса о терморегуляции
        run: |
          swiftc -parse-as-library macOS/ColiDev/scripts/verify_thermoregulation_question_identity.swift \
            -o "$RUNNER_TEMP/verify-thermoregulation-question-identity"
          "$RUNNER_TEMP/verify-thermoregulation-question-identity"

      - name: Verify shared physics calculation models
        run: |
          swiftc macOS/ColiDev/App/ForceMotion.swift macOS/ColiDev/scripts/verify_physics_models.swift \
            -o "$RUNNER_TEMP/verify-physics-models"
          "$RUNNER_TEMP/verify-physics-models"
          swiftc macOS/ColiDev/App/ForceMotion.swift macOS/ColiDev/scripts/verify_friction_motion.swift \
            -o "$RUNNER_TEMP/verify-friction-motion"
          "$RUNNER_TEMP/verify-friction-motion"
          swiftc macOS/ColiDev/App/ForceMotion.swift macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/scripts/verify_friction_prediction.swift \
            -o "$RUNNER_TEMP/verify-friction-prediction"
          "$RUNNER_TEMP/verify-friction-prediction"
          swiftc macOS/ColiDev/App/LengthMeasurement.swift macOS/ColiDev/scripts/verify_length_measurement.swift \
            -o "$RUNNER_TEMP/verify-length-measurement"
          "$RUNNER_TEMP/verify-length-measurement"

      - name: Verify shared linear equation model
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/LinearEquation.swift macOS/ColiDev/scripts/verify_linear_equation_model.swift \
            -o "$RUNNER_TEMP/verify-linear-equation-model"
          "$RUNNER_TEMP/verify-linear-equation-model"

      - name: Verify fraction and percent representation model
        run: |
          swiftc macOS/ColiDev/App/PercentRepresentation.swift macOS/ColiDev/scripts/verify_percent_representation.swift \
            -o "$RUNNER_TEMP/verify-percent-representation"
          "$RUNNER_TEMP/verify-percent-representation"
          swiftc macOS/ColiDev/App/GeometryMeasure.swift macOS/ColiDev/scripts/verify_geometry_measure.swift \
            -o "$RUNNER_TEMP/verify-geometry-measure"
          "$RUNNER_TEMP/verify-geometry-measure"

      - name: Verify programming loop trace model
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/LoopTrace.swift macOS/ColiDev/scripts/verify_loop_trace.swift \
            -o "$RUNNER_TEMP/verify-loop-trace"
          "$RUNNER_TEMP/verify-loop-trace"

      - name: Verify computational-thinking practice / Проверка тренажёра алгоритмического мышления
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/AlgorithmicThinkingPractice.swift macOS/ColiDev/scripts/verify_algorithmic_thinking.swift \
            -o "$RUNNER_TEMP/verify-algorithmic-thinking"
          "$RUNNER_TEMP/verify-algorithmic-thinking"

      - name: Verify Python input conversion practice / Проверка тренажёра преобразования ввода Python
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/PythonInputPractice.swift macOS/ColiDev/scripts/verify_python_input_practice.swift \
            -o "$RUNNER_TEMP/verify-python-input-practice"
          "$RUNNER_TEMP/verify-python-input-practice"

      - name: Verify answer choice order / Проверка порядка вариантов
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/EnglishLearningModels.swift \
            macOS/ColiDev/App/SQLQueryPractice.swift macOS/ColiDev/App/DebuggingPractice.swift \
            macOS/ColiDev/App/AlgorithmComplexity.swift macOS/ColiDev/scripts/verify_answer_choice_order.swift \
            -o "$RUNNER_TEMP/verify-answer-choice-order"
          "$RUNNER_TEMP/verify-answer-choice-order"

      - name: Verify osmosis prediction feedback / Проверка обратной связи в тренажёре осмоса
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/scripts/verify_osmosis_practice.swift \
            -o "$RUNNER_TEMP/verify-osmosis-practice"
          "$RUNNER_TEMP/verify-osmosis-practice"

      - name: Verify interactive answer feedback / Проверка разбора интерактивных ответов
        run: |
          swiftc macOS/ColiDev/App/L10n.swift macOS/ColiDev/scripts/verify_interactive_choice_feedback.swift \
            -o "$RUNNER_TEMP/verify-interactive-choice-feedback"
          "$RUNNER_TEMP/verify-interactive-choice-feedback"

      - name: Verify bilingual intro lesson questions / Проверка двуязычных вопросов вводных уроков
        run: |
          swiftc macOS/ColiDev/App/L10n.swift macOS/ColiDev/scripts/verify_intro_lesson_copy.swift \
            -o "$RUNNER_TEMP/verify-intro-lesson-copy"
          "$RUNNER_TEMP/verify-intro-lesson-copy"

      - name: Verify bilingual numbers and units / Проверка чисел и единиц RU/EN
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/L10n.swift macOS/ColiDev/scripts/verify_unit_formatting.swift \
            -o "$RUNNER_TEMP/verify-unit-formatting"
          "$RUNNER_TEMP/verify-unit-formatting"

      - name: Verify English tense feedback / Проверка объяснений по английским временам
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/L10n.swift macOS/ColiDev/scripts/verify_tense_contrast_feedback.swift \
            -o "$RUNNER_TEMP/verify-tense-contrast-feedback"
          "$RUNNER_TEMP/verify-tense-contrast-feedback"

      - name: Verify gene-regulation feedback / Проверка разбора регуляции гена
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/L10n.swift macOS/ColiDev/scripts/verify_gene_regulation_feedback.swift \
            -o "$RUNNER_TEMP/verify-gene-regulation-feedback"
          "$RUNNER_TEMP/verify-gene-regulation-feedback"

      - name: Verify learner-facing lesson feedback / Проверка разбора ответа ученику
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/scripts/verify_lesson_answer_feedback.swift \
            -o "$RUNNER_TEMP/verify-lesson-answer-feedback"
          "$RUNNER_TEMP/verify-lesson-answer-feedback"

      - name: Verify real tutor reply state / Проверка реального ответа тьютора
        run: |
          swiftc macOS/ColiDev/App/TutorRouteProbeState.swift macOS/ColiDev/scripts/verify_tutor_route_probe_state.swift \
            -o "$RUNNER_TEMP/verify-tutor-route-probe-state"
          "$RUNNER_TEMP/verify-tutor-route-probe-state"

      - name: Verify tutor composer readiness / Проверка готовности поля тьютора
        run: |
          swiftc macOS/ColiDev/App/TutorComposerReadiness.swift macOS/ColiDev/scripts/verify_tutor_composer_readiness.swift \
            -o "$RUNNER_TEMP/verify-tutor-composer-readiness"
          "$RUNNER_TEMP/verify-tutor-composer-readiness"

      - name: Verify adaptive study recommendation / Проверка следующего шага обучения
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/StudyRecommendation.swift macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/CustomCurriculum.swift macOS/ColiDev/scripts/verify_study_recommendation.swift \
            -o "$RUNNER_TEMP/verify-study-recommendation"
          "$RUNNER_TEMP/verify-study-recommendation"

      - name: Verify study progress decoding / Проверка чтения прогресса из backend
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/StudyRecommendation.swift macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/CustomCurriculum.swift macOS/ColiDev/scripts/verify_study_progress_decoding.swift \
            -o "$RUNNER_TEMP/verify-study-progress-decoding"
          "$RUNNER_TEMP/verify-study-progress-decoding"

      - name: Verify lesson Markdown rendering / Проверка отображения Markdown в уроках
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/LessonMarkdown.swift macOS/ColiDev/scripts/verify_lesson_markdown.swift \
            -o "$RUNNER_TEMP/verify-lesson-markdown"
          "$RUNNER_TEMP/verify-lesson-markdown"

      - name: Verify 3D surface geometry / Проверка геометрии 3D-поверхности
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/SurfacePlot3D.swift macOS/ColiDev/App/ConstrainedOptimization.swift macOS/ColiDev/scripts/verify_surface_plot_3d.swift \
            -o "$RUNNER_TEMP/verify-surface-plot-3d"
          "$RUNNER_TEMP/verify-surface-plot-3d"

      - name: Verify study-goal dashboard integration / Проверка цели в учебной панели
        run: python macOS/ColiDev/scripts/verify_study_goal_integration.py

      - name: Verify user-created curriculum / Проверка пользовательских курсов
        run: |
          swiftc -parse-as-library macOS/ColiDev/App/CustomCurriculum.swift macOS/ColiDev/scripts/verify_custom_curriculum.swift \
            -o "$RUNNER_TEMP/verify-custom-curriculum"
          "$RUNNER_TEMP/verify-custom-curriculum"

      - name: Verify programming file-reading practice model
        run: |
          swiftc macOS/ColiDev/App/FileReadingPractice.swift macOS/ColiDev/scripts/verify_file_reading_practice.swift \
            -o "$RUNNER_TEMP/verify-file-reading-practice"
          "$RUNNER_TEMP/verify-file-reading-practice"

      - name: Verify programming debugging practice model
        run: |
          swiftc macOS/ColiDev/App/DebuggingPractice.swift macOS/ColiDev/scripts/verify_debugging_practice.swift \
            -o "$RUNNER_TEMP/verify-debugging-practice"
          "$RUNNER_TEMP/verify-debugging-practice"

      - name: Verify programming transaction practice model
        run: |
          swiftc macOS/ColiDev/App/TransactionPractice.swift macOS/ColiDev/scripts/verify_transaction_practice.swift \
            -o "$RUNNER_TEMP/verify-transaction-practice"
          "$RUNNER_TEMP/verify-transaction-practice"

      - name: Verify programming SQL query practice model
        run: |
          swiftc macOS/ColiDev/App/SQLQueryPractice.swift macOS/ColiDev/scripts/verify_sql_query_practice.swift \
            -o "$RUNNER_TEMP/verify-sql-query-practice"
          "$RUNNER_TEMP/verify-sql-query-practice"

      - name: Verify biology experiment and food-web models
        run: |
          swiftc macOS/ColiDev/App/BiologyInvestigation.swift macOS/ColiDev/scripts/verify_biology_investigation.swift \
            -o "$RUNNER_TEMP/verify-biology-investigation"
          "$RUNNER_TEMP/verify-biology-investigation"

      - name: Verify biomolecule practice model and wiring
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/BiomoleculePractice.swift macOS/ColiDev/scripts/verify_biomolecule_practice.swift \
            -o "$RUNNER_TEMP/verify-biomolecule-practice"
          "$RUNNER_TEMP/verify-biomolecule-practice"
          python macOS/ColiDev/scripts/verify_biomolecule_integration.py

      - name: Verify gene expression model
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/GeneExpression.swift macOS/ColiDev/scripts/verify_gene_expression.swift \
            -o "$RUNNER_TEMP/verify-gene-expression"
          "$RUNNER_TEMP/verify-gene-expression"

      - name: Verify cell-cycle practice model / Проверка тренажёра клеточного цикла
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/CellCyclePractice.swift macOS/ColiDev/scripts/verify_cell_cycle_practice.swift \
            -o "$RUNNER_TEMP/verify-cell-cycle-practice"
          "$RUNNER_TEMP/verify-cell-cycle-practice"

      - name: Verify 3D cell organelle selection / Проверка выбора органелл в 3D-клетке
        run: python macOS/ColiDev/scripts/verify_cell3d_selection.py

      - name: Verify animal function practice model
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/AnimalFunctionPractice.swift macOS/ColiDev/scripts/verify_animal_function_practice.swift \
            -o "$RUNNER_TEMP/verify-animal-function-practice"
          "$RUNNER_TEMP/verify-animal-function-practice"

      - name: Verify natural-selection practice model
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/NaturalSelectionPractice.swift macOS/ColiDev/scripts/verify_natural_selection_practice.swift \
            -o "$RUNNER_TEMP/verify-natural-selection-practice"
          "$RUNNER_TEMP/verify-natural-selection-practice"

      - name: Verify zoology thermoregulation evidence model / Проверить модель данных терморегуляции
        run: |
          swiftc macOS/ColiDev/App/ThermoregulationPractice.swift macOS/ColiDev/scripts/verify_thermoregulation_practice.swift \
            -o "$RUNNER_TEMP/verify-thermoregulation-practice"
          "$RUNNER_TEMP/verify-thermoregulation-practice"

      - name: Verify English practice models and assessment events / Проверить тренажёры английского и события проверки
        run: |
          swiftc macOS/ColiDev/App/EnglishLearningModels.swift macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/scripts/verify_english_learning_models.swift \
            -o "$RUNNER_TEMP/verify-english-learning-models"
          "$RUNNER_TEMP/verify-english-learning-models"

      - name: Verify rational expression domain model
        run: |
          swiftc macOS/ColiDev/App/RationalExpression.swift macOS/ColiDev/scripts/verify_rational_expression.swift \
            -o "$RUNNER_TEMP/verify-rational-expression"
          "$RUNNER_TEMP/verify-rational-expression"

      - name: Verify quadratic function model / Проверка модели квадратичной функции
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/QuadraticFunctionPractice.swift macOS/ColiDev/scripts/verify_quadratic_function.swift \
            -o "$RUNNER_TEMP/verify-quadratic-function"
          "$RUNNER_TEMP/verify-quadratic-function"

      - name: Verify linear-function model and prediction feedback / Проверить линейную функцию и обратную связь
        run: |
          swiftc macOS/ColiDev/App/AnswerChoiceOrder.swift macOS/ColiDev/App/LinearFunctionModel.swift macOS/ColiDev/scripts/verify_linear_function_model.swift \
            -o "$RUNNER_TEMP/verify-linear-function-model"
          "$RUNNER_TEMP/verify-linear-function-model"

      - name: Verify trigonometry unit-circle model / Проверка модели единичной окружности
        run: |
          swiftc macOS/ColiDev/App/TrigonometricUnitCircle.swift macOS/ColiDev/scripts/verify_trigonometry_model.swift \
            -o "$RUNNER_TEMP/verify-trigonometry-model"
          "$RUNNER_TEMP/verify-trigonometry-model"

      - name: Verify constrained optimization model / Проверка модели условной оптимизации
        run: |
          swiftc macOS/ColiDev/App/ConstrainedOptimization.swift macOS/ColiDev/scripts/verify_constrained_optimization.swift \
            -o "$RUNNER_TEMP/verify-constrained-optimization"
          "$RUNNER_TEMP/verify-constrained-optimization"

      - name: Verify descriptive statistics model / Проверка модели описательной статистики
        run: |
          swiftc macOS/ColiDev/App/DescriptiveStatistics.swift macOS/ColiDev/scripts/verify_descriptive_statistics.swift \
            -o "$RUNNER_TEMP/verify-descriptive-statistics"
          "$RUNNER_TEMP/verify-descriptive-statistics"

      - name: Verify algorithm complexity model
        run: |
          swiftc macOS/ColiDev/App/AlgorithmComplexity.swift macOS/ColiDev/scripts/verify_algorithm_complexity.swift \
            -o "$RUNNER_TEMP/verify-algorithm-complexity"
          "$RUNNER_TEMP/verify-algorithm-complexity"

      - name: Verify held-out evaluation model / Проверка модели отложенной проверки
        run: |
          swiftc macOS/ColiDev/App/HeldOutEvaluation.swift macOS/ColiDev/scripts/verify_held_out_evaluation.swift \
            -o "$RUNNER_TEMP/verify-held-out-evaluation"
          "$RUNNER_TEMP/verify-held-out-evaluation"

      - name: Verify neuron signal model / Проверка модели сигнала нейрона
        run: |
          swiftc macOS/ColiDev/App/NeuronSignal.swift macOS/ColiDev/scripts/verify_neuron_signal.swift \
            -o "$RUNNER_TEMP/verify-neuron-signal"
          "$RUNNER_TEMP/verify-neuron-signal"

      - name: Verify vector kinematics model / Проверка модели векторов
        run: |
          swiftc macOS/ColiDev/App/VectorKinematics.swift macOS/ColiDev/scripts/verify_vector_kinematics.swift \
            -o "$RUNNER_TEMP/verify-vector-kinematics"
          "$RUNNER_TEMP/verify-vector-kinematics"

      - name: Verify thermal strategy model / Проверка модели теплообмена
        run: |
          swiftc macOS/ColiDev/App/ThermalStrategy.swift macOS/ColiDev/scripts/verify_thermal_strategy.swift \
            -o "$RUNNER_TEMP/verify-thermal-strategy"
          "$RUNNER_TEMP/verify-thermal-strategy"

      - name: Verify circulation route model / Проверка модели кровообращения
        run: |
          swiftc macOS/ColiDev/App/CirculationRoute.swift macOS/ColiDev/scripts/verify_circulation_route.swift \
            -o "$RUNNER_TEMP/verify-circulation-route"
          "$RUNNER_TEMP/verify-circulation-route"

      - name: Verify gradient descent model / Проверка модели градиентного спуска
        run: |
          swiftc macOS/ColiDev/App/GradientDescent.swift macOS/ColiDev/scripts/verify_gradient_descent.swift \
            -o "$RUNNER_TEMP/verify-gradient-descent"
          "$RUNNER_TEMP/verify-gradient-descent"

      - name: Verify synaptic summation model / Проверка модели суммации сигналов
        run: |
          swiftc macOS/ColiDev/App/SynapticSummation.swift macOS/ColiDev/scripts/verify_synaptic_summation.swift \
